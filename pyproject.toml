[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-alliance-automation"
version = "0.1.0"
description = "Extensible screen and input automation for LDPlayer"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.10,<6", "numpy>=2,<3"]

[project.scripts]
pet-alliance = "pet_alliance.cli:main"

[tool.setuptools.packages.find]
include = ["pet_alliance*"]
